<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia 3310 - HP Siswa (Retro Cipher)</title>
    <!-- Font Retro -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Modal Login Siswa Overlay */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-card {
            background: #1e293b;
            border: 2px solid #38bdf8;
            padding: 25px;
            border-radius: 12px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .login-card h2 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
        }

        /* Bungkus HP Nokia 3310 */
        .nokia-phone {
            width: 320px;
            background: #1e293b;
            border: 4px solid #475569;
            border-radius: 30px;
            padding: 20px 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .phone-brand {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* Layar LCD Nokia */
        .lcd-screen {
            width: 100%;
            background: #98a876;
            border: 4px solid #334155;
            border-radius: 6px;
            padding: 8px;
            color: #111827;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .lcd-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: bold;
            border-bottom: 1px dashed #55603a;
            padding-bottom: 3px;
            margin-bottom: 5px;
        }

        .lcd-body {
            font-size: 0.85rem;
            min-height: 55px;
            max-height: 55px;
            overflow-y: hidden;
            word-break: break-all;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .lcd-footer {
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            color: #333;
            border-top: 1px solid #55603a;
            padding-top: 2px;
        }

        /* Panel Soal Guru di HP */
        .question-banner {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }

        .question-banner span {
            color: #38bdf8;
            font-weight: bold;
        }

        /* Keypad Nokia Layout */
        .keypad {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .key {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            border-radius: 6px;
            padding: 10px 0;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 3px 0 #1e293b;
            transition: all 0.1s;
        }

        .key:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .key-num {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.85rem;
            display: block;
        }

        .key-letters {
            font-size: 0.65rem;
            color: #94a3b8;
            display: block;
            margin-top: 2px;
        }

        .key-special {
            background-color: #475569;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .btn-action {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn-action:hover {
            background-color: #0369a1;
        }
    </style>

    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAu-laSOM1Sq4E3_TOtY2c3-UkB4NWCZ2M",
            authDomain: "retro-communication.firebaseapp.com",
            databaseURL: "https://retro-communication-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "retro-communication",
            storageBucket: "retro-communication.firebasestorage.app",
            messagingSenderId: "1056778348399",
            appId: "1:1056778348399:web:e7856cd79b2db269402a9a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Sesi Siswa
        let currentGroup = localStorage.getItem('nokia_group_name') || "";
        let currentPulsa = parseInt(localStorage.getItem('nokia_group_pulsa')) || 10000;
        let costPerChar = 250; // Dynamic default

        // Load Dropdown List Kelompok
        const dbRef = ref(db);
        window.loadGroups = function() {
            get(child(dbRef, 'players')).then((snapshot) => {
                const selectEl = document.getElementById('groupSelect');
                selectEl.innerHTML = '<option value="">-- Pilih Kelompok Anda --</option>';
                if (snapshot.exists()) {
                    const groups = snapshot.val();
                    Object.keys(groups).forEach(gName => {
                        if (groups[gName].status !== 'DELETED') {
                            const opt = document.createElement('option');
                            opt.value = gName;
                            opt.textContent = gName;
                            selectEl.appendChild(opt);
                        }
                    });
                }
            });
        };
        window.loadGroups();

        // 1. REALTIME LISTENER CONFIG EKONOMI
        onValue(ref(db, 'room_session/config'), (snapshot) => {
            if (snapshot.exists()) {
                const config = snapshot.val();
                costPerChar = config.costPerChar || 250;
            }
        });

        // 2. CEK AUTO-LOGIN & SESSION WATCHER
        function initSessionWatcher(groupName) {
            onValue(ref(db, 'players/' + groupName), (snapshot) => {
                if (!snapshot.exists() || snapshot.val().status === 'DELETED') {
                    // SESSION KILL: Jika kelompok dihapus guru, panggil forced logout
                    alert("⚠️ Akses kelompok Anda telah dihapus oleh guru.");
                    logoutSiswa();
                } else {
                    const data = snapshot.val();
                    currentPulsa = data.pulsa;
                    localStorage.setItem('nokia_group_pulsa', currentPulsa);
                    document.getElementById('displayPulsa').innerText = currentPulsa.toLocaleString('id-ID');
                }
            });
        }

        if (currentGroup) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('displayGroupName').innerText = currentGroup;
            document.getElementById('displayPulsa').innerText = currentPulsa.toLocaleString('id-ID');
            initSessionWatcher(currentGroup);
        }

        // 3. FUNGSI LOGIN SISWA
        window.loginSiswa = async function() {
            const groupName = document.getElementById('groupSelect').value;
            const inputToken = document.getElementById('inputToken').value.trim();
            const inputPin = document.getElementById('inputPin').value.trim();

            if (!groupName || !inputToken || !inputPin) {
                alert("Semua field (Kelompok, Token, PIN) harus diisi!");
                return;
            }

            // Validasi Token Sesi Kelas
            const tokenSnap = await get(child(dbRef, 'room_session/active_token'));
            if (inputToken !== tokenSnap.val()) {
                alert("Token Sesi Kelas salah atau sudah kadaluarsa!");
                return;
            }

            // Validasi PIN Kelompok
            const groupSnap = await get(child(dbRef, 'players/' + groupName));
            if (!groupSnap.exists() || groupSnap.val().status === 'DELETED') {
                alert("Kelompok tidak ditemukan!");
                return;
            }

            if (groupSnap.val().pin !== inputPin) {
                alert("PIN Kelompok salah!");
                return;
            }

            // Login Berhasil
            currentGroup = groupName;
            currentPulsa = groupSnap.val().pulsa || 10000;

            localStorage.setItem('nokia_group_name', currentGroup);
            localStorage.setItem('nokia_group_pulsa', currentPulsa);

            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('displayGroupName').innerText = currentGroup;
            document.getElementById('displayPulsa').innerText = currentPulsa.toLocaleString('id-ID');

            initSessionWatcher(currentGroup);
        };

        function logoutSiswa() {
            localStorage.removeItem('nokia_group_name');
            localStorage.removeItem('nokia_group_pulsa');
            currentGroup = "";
            document.getElementById('loginOverlay').style.display = 'flex';
            window.loadGroups();
        }

        // 4. REALTIME LISTEN SOAL AKTIF
        onValue(ref(db, 'room_session/current_question'), (snapshot) => {
            const q = snapshot.val();
            document.getElementById('activeQuestionBox').innerText = q ? q : "Menunggu soal dikirim guru...";
        });

        // 5. ENGINE MULTI-TAP KEYPAD T9
        let typedText = "";
        let isUppercase = false;
        let lastKey = null;
        let charIndex = 0;
        let timer = null;

        const mapKeys = {
            '1': ['.', ',', '?', '!', '1'],
            '2': ['a', 'b', 'c', '2'],
            '3': ['d', 'e', 'f', '3'],
            '4': ['g', 'h', 'i', '4'],
            '5': ['j', 'k', 'l', '5'],
            '6': ['m', 'n', 'o', '6'],
            '7': ['p', 'q', 'r', 's', '7'],
            '8': ['t', 'u', 'v', '8'],
            '9': ['w', 'x', 'y', 'z', '9'],
            '0': [' ', '0']
        };

        window.pressKey = function(num) {
            if (num === '#') {
                isUppercase = !isUppercase;
                document.getElementById('capsIndicator').innerText = isUppercase ? "ABC" : "abc";
                return;
            }

            if (num === 'C') {
                if (typedText.length > 0) {
                    typedText = typedText.slice(0, -1);
                    updateLCD();
                }
                return;
            }

            if (mapKeys[num]) {
                if (currentPulsa < costPerChar) {
                    alert(`Pulsa habis! Diperlukan minimal Rp${costPerChar} per karakter.`);
                    return;
                }

                if (lastKey === num) {
                    charIndex = (charIndex + 1) % mapKeys[num].length;
                    typedText = typedText.slice(0, -1);
                } else {
                    lastKey = num;
                    charIndex = 0;
                    currentPulsa -= costPerChar;
                    document.getElementById('displayPulsa').innerText = currentPulsa.toLocaleString('id-ID');
                }

                let char = mapKeys[num][charIndex];
                if (isUppercase) char = char.toUpperCase();

                typedText += char;
                updateLCD();

                clearTimeout(timer);
                timer = setTimeout(() => {
                    lastKey = null;
                    charIndex = 0;
                }, 1000);
            }
        };

        function updateLCD() {
            document.getElementById('lcdText').innerText = typedText || "_";
        }

        // 6. KIRIM SMS JAWABAN
        window.sendSMS = function() {
            if (!typedText.trim()) return alert("Pesan masih kosong!");

            const costDeducted = typedText.length * costPerChar;

            push(ref(db, 'submissions'), {
                playerName: currentGroup,
                answerText: typedText,
                costDeducted: costDeducted,
                remainingPulsa: currentPulsa,
                status: 'PENDING',
                timestamp: new Date().toLocaleTimeString()
            });

            update(ref(db, 'players/' + currentGroup), {
                pulsa: currentPulsa
            });

            alert("📤 SMS Jawaban dikirim ke Guru!");
            typedText = "";
            updateLCD();
        };
    </script>
</head>
<body>

    <!-- MODAL LOGIN / MASUK KELAS -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <h2>📱 MASUK KELAS NOKIA</h2>
            <div class="form-group">
                <label>Pilih Kelompok:</label>
                <select id="groupSelect" class="form-control">
                    <option value="">Memuat daftar kelompok...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Token Sesi Kelas:</label>
                <input type="text" id="inputToken" class="form-control" placeholder="cth: N3310-1234">
            </div>
            <div class="form-group">
                <label>PIN Kelompok (4 Digit):</label>
                <input type="password" id="inputPin" class="form-control" placeholder="****" maxlength="4">
            </div>
            <button class="btn-action" onclick="loginSiswa()">HUBUNGKAN KE JARINGAN</button>
        </div>
    </div>

    <!-- BUNGKUS UTAMA HP NOKIA 3310 -->
    <div class="nokia-phone">
        <div class="phone-brand">NOKIA 3310 • RETRO CIPHER</div>

        <!-- LAYAR LCD -->
        <div class="lcd-screen">
            <div class="lcd-header">
                <span id="displayGroupName">KELOMPOK</span>
                <span>Rp<span id="displayPulsa">10.000</span></span>
            </div>
            <div class="lcd-body" id="lcdText">_</div>
            <div class="lcd-footer">
                <span id="capsIndicator">abc</span>
                <span>SMS</span>
            </div>
        </div>

        <!-- BANNER SOAL AKTIF -->
        <div class="question-banner">
            <span style="font-size:0.75rem; color:#94a3b8; display:block;">Soal dari Guru:</span>
            <div id="activeQuestionBox" style="color: #facc15; font-weight: bold; margin-top: 2px;">Menunggu soal dikirim guru...</div>
        </div>

        <!-- KEYPAD MATRIKS -->
        <div class="keypad">
            <button class="key" onclick="pressKey('1')">
                <span class="key-num">1</span>
                <span class="key-letters">.,?!</span>
            </button>
            <button class="key" onclick="pressKey('2')">
                <span class="key-num">2</span>
                <span class="key-letters">ABC</span>
            </button>
            <button class="key" onclick="pressKey('3')">
                <span class="key-num">3</span>
                <span class="key-letters">DEF</span>
            </button>
            
            <button class="key" onclick="pressKey('4')">
                <span class="key-num">4</span>
                <span class="key-letters">GHI</span>
            </button>
            <button class="key" onclick="pressKey('5')">
                <span class="key-num">5</span>
                <span class="key-letters">JKL</span>
            </button>
            <button class="key" onclick="pressKey('6')">
                <span class="key-num">6</span>
                <span class="key-letters">MNO</span>
            </button>

            <button class="key" onclick="pressKey('7')">
                <span class="key-num">7</span>
                <span class="key-letters">PQRS</span>
            </button>
            <button class="key" onclick="pressKey('8')">
                <span class="key-num">8</span>
                <span class="key-letters">TUV</span>
            </button>
            <button class="key" onclick="pressKey('9')">
                <span class="key-num">9</span>
                <span class="key-letters">WXYZ</span>
            </button>

            <button class="key key-special" onclick="pressKey('#')">
                <span class="key-num">#</span>
                <span class="key-letters">Shift</span>
            </button>
            <button class="key" onclick="pressKey('0')">
                <span class="key-num">0</span>
                <span class="key-letters">Space</span>
            </button>
            <button class="key key-special" style="background-color: #ef4444;" onclick="pressKey('C')">
                <span class="key-num">C</span>
                <span class="key-letters">Hapus</span>
            </button>
        </div>

        <!-- TOMBOL KIRIM SMS -->
        <button class="btn-action" onclick="sendSMS()">KIRIM SMS JAWABAN</button>
    </div>

</body>
</html>
